services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: codex-notify-ntfy
    hostname: ntfy
    init: true
    restart: unless-stopped
    command: serve
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "80"
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://notify.luisdourado.com}
      NTFY_LISTEN_HTTP: :80
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_BEHIND_PROXY: "true"
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ntfy_data:/var/lib/ntfy
    networks:
      cloudflare-ingress:
        aliases:
          - ntfy
          - codex-notify
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --tries=1 http://127.0.0.1:80/v1/health -O - | grep -Eo '"healthy"\s*:\s*true' || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ntfy_data:

networks:
  cloudflare-ingress:
    external: true
    name: cloudflare_ingress
