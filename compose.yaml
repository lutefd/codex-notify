services:
  codex-notify-ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: codex-notify-ntfy
    hostname: codex-notify-ntfy
    init: true
    restart: unless-stopped
    command: serve
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "80"
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://notify.luisdourado.com}
      NTFY_LISTEN_HTTP: :80
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_BEHIND_PROXY: "true"
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ntfy_data:/var/lib/ntfy
    networks:
      cloudflare-ingress:
        aliases:
          - codex-notify-ntfy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --tries=1 http://127.0.0.1:80/v1/health -O - | grep -Eo '"healthy"\s*:\s*true' || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  codex-notify-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-notify-gateway:local
    container_name: codex-notify-gateway
    hostname: codex-notify-gateway
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    environment:
      CODEX_NOTIFY_GATEWAY_TOKEN_FILE: /run/secrets/codex_notify_gateway_token
      CODEX_NOTIFY_GATEWAY_HOST: 0.0.0.0
      CODEX_NOTIFY_GATEWAY_PORT: "8080"
      NTFY_BASE_URL: http://codex-notify-ntfy
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env or the environment}
      NTFY_TOKEN_FILE: /run/secrets/ntfy_publisher_token
      NTFY_ALLOW_INSECURE_HTTP: "1"
    secrets:
      - codex_notify_gateway_token
      - ntfy_publisher_token
    networks:
      cloudflare-ingress:
        aliases:
          - codex-notify-gateway
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ntfy_data:

networks:
  cloudflare-ingress:
    external: true
    name: cloudflare_ingress

secrets:
  codex_notify_gateway_token:
    file: ${CODEX_GATEWAY_TOKEN_FILE:-/home/luis/.config/codex-notify/gateway.token}
  ntfy_publisher_token:
    file: ${NTFY_PUBLISH_TOKEN_FILE:-/home/luis/.config/codex-notify/publisher.token}
